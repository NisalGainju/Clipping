<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viral Clipper</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --fg:#e8eaf0; --mut:#8b92a5; --acc:#ffd23f; --ok:#3ddc97; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { margin: 0 0 4px; } .sub { color: var(--mut); margin-bottom: 24px; }
  .panel { background: var(--card); border-radius: 14px; padding: 18px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  input[type=text] { flex:1 1 380px; padding:12px 14px; border-radius:10px; border:1px solid #2a2f3a; background:#10131a; color:var(--fg); }
  input[type=number], select { padding:10px; border-radius:10px; border:1px solid #2a2f3a; background:#10131a; color:var(--fg); width:110px; }
  button { padding:12px 20px; border:0; border-radius:10px; background:var(--acc); color:#111; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  label { color:var(--mut); font-size:13px; display:flex; flex-direction:column; gap:4px; }
  .opts { margin-top:12px; } .or { color:var(--mut); margin:10px 0 0; font-size:13px; }
  .bar { height:10px; background:#10131a; border-radius:99px; overflow:hidden; margin-top:16px; }
  .bar > div { height:100%; width:0; background:var(--ok); transition:width .4s; }
  #status { margin-top:8px; color:var(--mut); } .err { color:#ff6b6b !important; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; margin-top:24px; }
  .clip { background:var(--card); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }
  .clip video { width:100%; aspect-ratio:9/16; background:#000; object-fit:cover; }
  .clip .body { padding:12px 14px 16px; display:flex; flex-direction:column; gap:6px; }
  .score { display:inline-block; font-weight:800; color:#111; background:var(--acc); padding:2px 10px; border-radius:99px; }
  .meta { color:var(--mut); font-size:13px; } .tags { color:#7fb3ff; font-size:13px; }
  .dims { font-size:12px; color:var(--mut); }
  a.dl { margin-top:6px; text-align:center; text-decoration:none; background:#232834; color:var(--fg); padding:9px; border-radius:8px; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Viral Clipper</h1>
  <div class="sub">Paste a YouTube / Twitch / Kick link, get ranked vertical clips. Only process content you have the rights to.</div>
  <div class="panel">
    <div class="row">
      <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=...">
      <button id="go">Generate clips</button>
    </div>
    <div class="or">or upload a file: <input id="file" type="file" accept="video/*"></div>
    <div class="row opts">
      <label>Clips (blank = auto)<input id="n" type="number" min="1" max="30"></label>
      <label>Min length (s)<input id="min" type="number" value="20"></label>
      <label>Max length (s)<input id="max" type="number" value="60"></label>
      <label>Captions<select id="style"><option>pop</option><option>clean</option><option>boxed</option></select></label>
    </div>
    <div class="bar"><div id="fill"></div></div>
    <div id="status"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.round(s); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function start() {
  $('grid').innerHTML = ''; $('status').className = ''; $('go').disabled = true;
  try {
    let source = $('url').value.trim();
    const f = $('file').files[0];
    if (f) {
      $('status').textContent = 'Uploading...';
      const fd = new FormData(); fd.append('file', f);
      source = (await (await fetch('/api/upload', {method:'POST', body: fd})).json()).source;
    }
    if (!source) throw new Error('Paste a URL or choose a file.');
    const body = { source, caption_style: $('style').value,
      num_clips: $('n').value ? +$('n').value : null,
      min_clip_s: +$('min').value, max_clip_s: +$('max').value };
    const r = await fetch('/api/jobs', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (!r.ok) throw new Error('Could not start job.');
    poll((await r.json()).id);
  } catch (e) { fail(e.message); }
}

function fail(msg) { $('status').className = 'err'; $('status').textContent = msg; $('go').disabled = false; }

async function poll(id) {
  const j = await (await fetch('/api/jobs/' + id)).json();
  $('fill').style.width = (j.progress * 100) + '%';
  if (j.status === 'error') return fail(j.error);
  if (j.status === 'done') { $('status').textContent = `Done: ${j.result.clips.length} clips`; $('go').disabled = false; return render(j.result); }
  $('status').textContent = `${j.stage}: ${j.message} (${Math.round(j.progress * 100)}%)`;
  setTimeout(() => poll(id), 1500);
}

function render(res) {
  $('grid').innerHTML = res.clips.map(c => `
    <div class="clip">
      <video controls preload="none" poster="${esc(c.thumbnail_url)}" src="${esc(c.video_url)}"></video>
      <div class="body">
        <div><span class="score">${c.score.toFixed(0)}</span> &nbsp;#${c.rank}</div>
        <b>${esc(c.title)}</b>
        <div class="meta">${fmt(c.start)} - ${fmt(c.end)} in source &middot; ${c.duration.toFixed(0)}s</div>
        <div class="dims">hook ${c.dims.hook} · emotion ${c.dims.emotion} · share ${c.dims.shareability} · standalone ${c.dims.independence}</div>
        <div>${esc(c.description)}</div>
        <div class="tags">${(c.hashtags || []).map(esc).join(' ')}</div>
        <a class="dl" href="${esc(c.video_url)}" download>Download MP4</a>
      </div>
    </div>`).join('');
}
$('go').onclick = start;
</script>
</body>
</html>
